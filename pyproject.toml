[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veillock"
version = "0.1.0"
description = "Live-stream encryption protocol: encrypt visual output before it reaches any external display (VeilLock, July 2026)."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "encryption",
    "streaming",
    "display",
    "forward-secrecy",
    "aes-gcm",
    "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.24",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
tether = ["opencv-python-headless>=4.8", "pyvirtualcam>=0.11"]

[project.scripts]
veillock = "veillock.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/veillock"
Download = "https://github.com/AzielEliab/veillock/releases"
Issues = "https://github.com/AzielEliab/veillock/issues"

[tool.setuptools.packages.find]
include = ["veillock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
